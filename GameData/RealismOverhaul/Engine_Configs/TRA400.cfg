//	==================================================
//	Engine: TRA-400
//
//	Manufacturer: Junkers
//
//	=================================================================================
//	TRA-400
//	1995, Sanger II (Version 4/92)
//
//	Dry Mass: 3000 kg
//	Thrust (Dry): ??? kN
//	Thrust (Wet): 400 kN (5 on Sanger-II EHTV)
//	SFC (Dry): 0.9 lb/lbf-hr
//	Area: 2.5 m^2	//Compressor Area
//	BPR: 0.0		//Bypass Ratio
//	CPR: 6.0		//Compressor Pressure Ratio
//	FPR: 0.0		//Fan Ratio
//	Mdes: 4.4 M		//Mach Design Point (Maximum Mach of 6.7, but designed for a 4.4 cruise)
//	Tdes: 280 K		//Temp Design Point (Taking a number from the J58 and running with it...)
//	eta_n: 0.98		//Efficiency at afterburner rear / nozzle entrance (Assumed)
//	FHV: 98000000 J	//Fuel heat of burning
//	TIT: 1200 K		//Combustion peak temp
//	TAB: 2000* K		//Afterburner peak temp
//	maxT3: 850 K	//Turbine max temperature (Copying the Model 304's homework...)
//  tt7_max = 5000	//manually override solver max temp to get hydrogen engines to work
//	Exhaust Mixer: false
//	Adjustable Nozzle: true
//	=================================================================================
//	Sources:

//	https://www.fzt.haw-hamburg.de/pers/Scholz/dglr/hh/text_2013_11_28_Hyperschall.pdf
//  'A space transporter for the year 2000' https://www.secretprojects.co.uk/threads/s%C3%A4nger-ii-saenger-ii-aerospaceplane-project.580/post-278789
//  https://www.flickr.com/photos/sdasmarchives/51203423785/

//	Used by:

//	Notes:   Engine is about 2.068m (assumed 2m flat) according to the flicker image, which is from an official source. The intakes were a bit bigger though, as they were taller than they were wide.

//	==================================================
@PART[*]:HAS[#engineType[TRA400]]:FOR[RealismOverhaulEngines]
{

	%title = TRA-400 Turboramjet
	%manufacturer = Junekrs
	%description = FIXME

	@tags ^= :$: usa pratt whitney p&w j58 jt11 afterburning turbojet

	%specLevel = prototype	//operational, prototype, concept, speculative, altHist, sciFi

	@MODULE[ModuleEngines*]
	{
		@name = ModuleEnginesAJEJet
		%EngineType = Turbine
		@PROPELLANT[LiquidFuel]
		{
			@name = LqdHydrogen
		}
	}
	@MODULE[ModuleAlternator]
	{
		@RESOURCE[ElectricCharge]
		{
			%rate = 75.0
		}
	}

	!MODULE[ModuleGimbal]{}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEnginesAJEJet
		configuration = TRA-400
		modded = false
		origMass = 3.0

		CONFIG
		{
			name = TRA-400
			description = TRA-400, as designed for the Sänger II EHTV. Temperature Mach limit at 31 km: 6.7.
			specLevel = prototype
			massMult = 1.00

			Area = 2.5		//Compressor Area
			BPR = 0.0		//Bypass Ratio
			CPR = 6.0		//Compressor Pressure Ratio
			FPR = 0.0		//Fan Ratio
			Mdes = 4.4		//Mach Design Point
			Tdes = 280		//Temp Design Point
			eta_c = 0.95	//Efficiency at burner inlet
			eta_t = 0.98	//Efficiency at burner exit
			eta_n = 0.98		//Efficiency at afterburner rear / nozzle entrance
			FHV = 98000000	//Fuel heat of burning (joules?)
			TIT = 1200		//Combustion peak temp
			TAB = 2000		//Afterburner temp?
			maxT3 = 850		//Turbine max temperature
			tt7_max = 5000	//manually override solver max temp to get hydrogen engines to work
			exhaustMixer = False
			adjustableNozzle = True
			thrustUpperLimit = 400

			// Engine fitting params
			defaultTPR = 0.85    //IDK what this does 8)
			dryThrust = 111.2
			wetThrust = 400.0
			maxThrust = 400.0	//Just to let MEC know thrust
			drySFC = 0.9
			throttleResponseMultiplier = 0.20

			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 1.0
				DrawGauge = True
			}
		}
	}
}

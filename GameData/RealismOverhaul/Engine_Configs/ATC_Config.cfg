@PART[*]:HAS[#engineType[ATC]]:AFTER[RealismOverhaulEngines]
{
	@title = ATC-1400
	@manufacturer = #roMfrMBB
	@description = The ATC (Advanced Topping Cycle) Engine was a hydrogen staged combustion engine planned to power the HORUS (Hypersonic ORbital Upper Stage) spaceplane, part of the Saengar II hypersonic airlaunch system.

	%specLevel = concept

	@tags ^= :$: Germany Messerschmitt HORUS Sanger Sanger-II airlaunch staged combustion lqdhydrogen lqdoxygen

	@MODULE[ModuleEngines*]
	{
		%EngineType = LiquidFuel
	}

	!MODULE[ModuleAlternator],*{}
	!RESOURCE,*{}
	!MODULE[ModuleEngineConfigs],*{}

	@MODULE[ModuleGimbal]
	{
		@gimbalRange = 8.5
		%useGimbalResponseSpeed = true
		%gimbalResponseSpeed = 16
	}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		configuration = ATC-1400
		origMass = 2.371
		modded = false
		CONFIG
		{
			name = ATC-1400
			description = April 1992 design of the HORUS Advanced Toppinc Cycle Engine, rated to 1400kN
			specLevel = concept
			minThrust = 140 //quoted as running to a "maximum of 10% thrust" prior to stage separation, I assume maximum is a typo.
			maxThrust = 1400
			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 0.7286
				DrawGauge = true
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.2714
			}
			atmosphereCurve
			{
				key = 0 469 // [6] p129
							//Original sin has been resolved. Send it
				key = 1 350
			}

			%ullage = False
			%pressureFed = False
			%ignitions = 1
			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.5
			}
			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 4615
				ratedBurnTime = 298			// if you take the total fuel mass of the vehicle and divide it by thrust, this actually works out.
				overburnPenalty = 1.5		//Keep some penalty, RS25s tended to wear out before 55 mission limit
				safeOverburn = true

				// assume roughly exponential relationship between chamber pressure and lifespan
				thrustModifier
				{
					key = 0.00 0.05 0 0
					key = 1.00 1.00 3 3
				}

				ignitionReliabilityStart = 0.989894
				ignitionReliabilityEnd = 0.998404
				cycleReliabilityStart = 0.989894
				cycleReliabilityEnd = 0.998404
			}
		}
		CONFIG
		{
			name = ATC-1500
			description = December 1992 design of the HORUS Advanced Toppinc Cycle Engine, rated to 107% thrust
			specLevel = concept
			minThrust = 150	//quoted as running to a "maximum of 10% thrust" prior to stage separation, I assume maximum is a typo.
			maxThrust = 1500
			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 0.7286
				DrawGauge = true
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.2714
			}
			atmosphereCurve
			{
				key = 0 469 // [6]
							//Original sin has been resolved. Send it
				key = 1 350
			}

			%ullage = False
			%pressureFed = False
			%ignitions = 1
			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 0.5
			}
			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				testedBurnTime = 4615
				ratedBurnTime = 298			// if you take the total fuel mass of the vehicle and divide it by thrust, this actually works out.
				overburnPenalty = 1.5		//Keep some penalty, RS25s tended to wear out before 55 mission limit
				safeOverburn = true

				// assume roughly exponential relationship between chamber pressure and lifespan
				thrustModifier
				{
					key = 0.00 0.05 0 0
					key = 1.00 1.00 3 3
				}

				ignitionReliabilityStart = 0.989894
				ignitionReliabilityEnd = 0.998404
				cycleReliabilityStart = 0.989894
				cycleReliabilityEnd = 0.998404
			}
		}
	}
}


//	==================================================
//	Engine: JTF17
//
//	Manufacturer: Pratt & Whitney
//
//	=================================================================================
//	JTF17
//	1967, 2707, L-2000 
//
//	Dry Mass: 4763 kg
//	Thrust (Dry): 170.36 kN
//	Thrust (Wet): 271.34 kN
//	SFC (Dry): 0.75 lb/lbf-hr
//	Area: 1.8098  m^2	//Compressor Area (4.98 ft fan diameter, 80 in thrust reverser diameter, 215 in length.) 
//	BPR: 1.3		//Bypass Ratio
//	CPR: 12.95		//Compressor Pressure Ratio (Primary Pressure Ratio?)
//	FPR: 2.90		//Fan Ratio
//	Mdes: ??? M		//Mach Design Point
//	Tdes: 280 K		//Temp Design Point
//	eta_n: 0.9		//Efficiency at afterburner rear / nozzle entrance
//	FHV: 36000000 J	//Fuel heat of burning
//	TIT: 1477 K		//Combustion peak temp
//	TAB: 1940 K		//Afterburner peak temp (Afterburner derived from J58?)
//	maxT3: 1533 K	//Turbine max temperature
//	Exhaust Mixer: false
//	Adjustable Nozzle: true (I assume????)
//	=================================================================================



//	Sources:

//	https://dn710102.ca.archive.org/0/items/DTIC_AD0378363/DTIC_AD0378363.pdf
//  https://archive.org/details/TNM_Pratt_and_Whitney_Aircraft_JTF17_augmented_turb_20171024_0210
//  https://www.secretprojects.co.uk/threads/p-w-jtf17-proposed-boeing-2707-sst-engine.12721/
//  https://www.airliners.net/forum/viewtopic.php?t=748369#p10842285
//  https://www.scribd.com/document/849703474/JTF17-21L


//	Used by:

//	Notes:

//	==================================================
@PART[*]:HAS[#engineType[JTF17]]:FOR[RealismOverhaulEngines]
{

	%title = #roJTF17title	//JTF17 Turbofan
	%manufacturer = #roMfrPW
	%description = #roJTF17Desc

	@tags ^= :$: usa Pratt Whitney PW JTF17 j5p j6h afterburning turbofan SST

	%specLevel = prototype	//operational, prototype, concept, speculative, altHist, sciFi

	@MODULE[ModuleEngines*]
	{
		@name = ModuleEnginesAJEJet
		%EngineType = Turbine
		@PROPELLANT[LiquidFuel]
		{
			@name = Kerosene
		}
	}
	@MODULE[ModuleAlternator]
	{
		@RESOURCE[ElectricCharge]
		{
			%rate = 100.0
		}
	}

	!MODULE[ModuleGimbal]{}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEnginesAJEJet
		configuration = GE4-J5P
		modded = false
		origMass = 4.8

		CONFIG
		{
			name = JTF17A
			description = JTF17A afterburning turbofan, intended to power the B2707 and L-2000. Temperature Mach limit at 15 km: 2.75.
			specLevel = prototype
			massMult = 1
			
			Area = 1.8		//Compressor Area
			BPR = 1.3		//Bypass Ratio
			CPR = 12.95		//Compressor Pressure Ratio
			FPR = 2.9		//Fan Ratio
			Mdes = 1.0		//Mach Design Point
			Tdes = 280		//Temp Design Point
			eta_c = 0.95	//Efficiency at burner inlet
			eta_t = 0.98	//Efficiency at burner exit
			eta_n = 0.9		//Efficiency at afterburner rear / nozzle entrance
			FHV = 36000000	//Fuel heat of burning (joules?)
			TIT = 1477		//Combustion peak temp
			TAB = 1940		//Afterburner temp? (assuming this is the same??)
			maxT3 = 1533		//Turbine max temperature
			exhaustMixer = False
			adjustableNozzle = True
			thrustUpperLimit = 271.34
			
			// Engine fitting params
			defaultTPR = 0.85  //IDK what this does.
			dryThrust = 170.36
			wetThrust = 271.34
			maxThrust = 271.34	//Just to let MEC know thrust
			drySFC = 0.75
			throttleResponseMultiplier = 0.60

			PROPELLANT
			{
				name = Kerosene
				ratio = 1.0
				DrawGauge = True
			}
		}
	}
}

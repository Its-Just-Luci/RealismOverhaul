//	==================================================
//	Engine: TRA-400 12/92
//
//	Manufacturer: Messerschmitt-Bölkow-Blohm
//
//	=================================================================================
//	TRA-400-12-92
//	1992, Sanger II
//  Envelope M0.0@0km to M3.5@25km  [1] (defined by 1988)
//
//	Dry Mass: 3,000 kg               //[5] bad outdated source is bad and outdated, but it's the best I've got, dammit.
//	Thrust (Dry): 200 kN             //[1], [4] figures listed below. Thrust dry assumed as thrust right before afterburner ignition, though in theory takeoff thrust is 475 dry.
//	Thrust (Wet): 260 kN             //[1] Figure 4.34 [4] figure 16. Max thrust shown to be ~466kN (reading bottom of blue curve) at Mach 2.0. Takeoff thrust is shown at ~475kN
//	SFC (Dry): 0.980 lb/lbf-hr       //[1] No SFC quoted, so time to use that 3/4ths of an engineering degree I have >:) Methodology: turbojet quoted at about 8% of the total flight by distance, and ~25% of the fuel expended. Average speed calculations and a quarter of the fuel gave me ~33500kg over 7.16 minutes, or modt = 281512.60kg/hr. mdot/6*260,000N (6 engines running dry at full thrust) gives 0.18kg/N-hr or 0.98lb/lbf-hr
//	Area: 1.767 m^2	                 //Compressor Area [1] Figure 4.55, turbo-engine inlet cross section is shown to be ~1.5m across
//	BPR: 0.0		                 //Bypass Ratio
//	CPR: 7.84		                 //Compressor Pressure Ratio [6] Assumed a similar gamma value to the model 304
//	FPR: 0.0		                 //Fan Ratio
//	Mdes: 2.0 M		                 //Mach Design Point (assumed this is Mach at which maximum thrust occurs as per [1],[4])
//	Tdes: 1000 K                     //Temp Design Point [1] [4] (Using Compressor exit temperature as the baseline here)
//	eta_n: 0.98                      //Efficiency at nozzle entrance (assumed)
//	FHV: 98000000 J	                 //Fuel heat of burning [3] Copying other's homework, but citing sources!
//	TIT: 2050 K		                 //Combustion peak temp [1] [4]
//	TAB: 2800 K		                 //Afterburner peak temp [1] [4]
//	maxT3: 2000 K	                 //Turbine max temperature [1] [2] [4](T3 =! "Max Turbine Temperature" T3 is burner entry temperature.)
//  tt7_max: 2800	                 //Model 304 has this at 5000K, [1] [4] has it (ToT) at 2800K
//	Exhaust Mixer: false
//	Adjustable Nozzle: true
//	=================================================================================
//	TRA-400-12-92 (Ramjet Bypass Mode)
//	1987, Sanger II
//	Envelope M3.5@25km to M6.8@31km [1] (defined by 1988)
//
//
//	Dry Mass: 3,000 kg              //[5] bad outdated source is bad and outdated, but it's the best I've got, dammit.
//	Thrust: 367 kN	                //[1] Figure 4.34 [4] figure 16.
//	Area: 0.12 m^2                  //Area [1] Figure 4.55 Ramjet bypass is shown to be a 0.25m wide taurus arround the turbojet, thus subtracting the 1.767m^2 from above from a 1.55m circle's area gives the ramjet inlet area
//	Mdes: 6.8 M	                    //Mach Design Point [1] Point of highest thrust is Mach 3.5, this may cause the curve to be a bit more accurate.
//	Tdes: 1000 K                    //Temp Design Point (1000K is an assumption. If AJE's math fails, fall back to SR-71/STRJ11A's 280K)
//	eta_n: 0.98                     //Efficiency at nozzle entrance (assumed)
//	FHV: 64800000 J                 //Fuel heat of burning (Value made up. Copied from STRJ11A_config.cfg)
//	maxFar: 0.07                    //Max fuel to air ratio (Value made up. Copied from STRJ11A_config.cfg)
//	maxEngineTemp: 7000 K           //Engine max temperature (Mach 6.8)
//	=================================================================================

//	Sources:

//	[1] Reusable Space Transportation Systems - Heribert Kuczera & Peter W. Sacher
//  [2] https://www.grc.nasa.gov/www/k-12/airplane/turbdraw.html
//  [3] https://github.com/KSP-RO/RealismOverhaul/blob/master/GameData/RealismOverhaul/Engine_Configs/Jet_Engine_Configs/Model304_Config.cfg
//  [4] https://archive.org/details/DTIC_ADA592434/page/16-17/mode/2up
//  [5] https://www.secretprojects.co.uk/attachments/eirv14n08-19870220_028-a_space_transporter_for_the_year-pdf.554468/
//  [6] https://www.grc.nasa.gov/www/k-12/airplane/compth.html

//	Used by:

//	Notes:
// ——HTP Phase Ib: Sanger II Co-Axial Turboramjet dimensions 04/1990——
//
//          Combustion Chamber diameter:        0.33m
//          Compressor Inlet Diameter:         ~1.50m
//          Ramjet Bypass Duct Diameter:       ~0.25m
//
//	=================================================================================
@PART[*]:HAS[#engineType[TRA400]]:FOR[RealismOverhaulEngines]
{

	%title = TRA-400 Co-Axial Turboramjet
	%manufacturer = Messerschmitt-Bölkow-Blohm
	%description = The end result of the West-German HTP and HEV studies, the TRA-400 is a hypersonic turboramjet built by Messerschmitt-Bölkow-Blohm, for use on the Sanger-II first stage. Consisting of a hydrogen fueled turbojet rated for Mach 3.5, and a hydrogen fueled ramjet rated for speeds up to Mach 6.8, the engine was one of the most capable and advanced proposals of its time.

	@tags ^= :$: MBB West Germany TRA-400 turboramjet hypersonic Sanger Sanger-II HTP

	%specLevel = prototype	//operational, prototype, concept, speculative, altHist, sciFi
	// ramjet engine saw a tested prorotype, and given it was far and away the most advanced part, I'd say it falls in the prototype realm.

	!MODULE[ModuleEngines*],*{}

	MODULE
	{
		name = ModuleEnginesAJEJet
		EngineType = Turbine
		thrustVectorTransformName = thrustTransform
		engineID = MainEngine
	}
	MODULE
	{
		name = ModuleEnginesAJERamjet
		EngineType = Turbine
		thrustVectorTransformName = thrustTransform
		engineID = BackupEngine
	}

	@MODULE[ModuleAlternator]
	{
		@RESOURCE[ElectricCharge]
		{
			%rate = 50.0
		}
	}
	!MODULE[ModuleGimbal]{}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEnginesAJEJet
		configuration = TRA-400-mode1
		engineID = MainEngine
		isMaster = True
		origMass = 3.00

		CONFIG
		{
			name = TRA-400-mode1
			description = JT11D-20, as used on the SR-71A/B and YF-12A. Temperature Mach limit at 15 km: 3.6.
			specLevel = operational
			massMult = 1.00

			Area = 1.767		//Compressor Area
			BPR = 0.0		//Bypass Ratio
			CPR = 7.84		//Compressor Pressure Ratio
			FPR = 0.0		//Fan Ratio
			Mdes = 2.0		//Mach Design Point
			Tdes = 280		//Temp Design Point
			eta_c = 0.98	//Efficiency at burner inlet
			eta_t = 0.98	//Efficiency at burner exit
			eta_n = 0.98		//Efficiency at afterburner rear / nozzle entrance
			FHV = 98000000	//Fuel heat of burning (joules?)
			TIT = 2050		//Combustion peak temp
			TAB = 2800		//Afterburner temp?
			maxT3 = 1400		//Turbine max temperature
			tt7_max = 5000
			exhaustMixer = False
			adjustableNozzle = True
			thrustUpperLimit = 475

			// Engine fitting params
			defaultTPR = 0.85
			dryThrust = 200
			wetThrust = 260
			maxThrust = 475	//Just to let MEC know thrust
			drySFC = 0.98
			throttleResponseMultiplier = 0.20

			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 1.0
				DrawGauge = True
			}

			OtherModules
			{
				BackupEngine = TRA-400-mode2
			}
		}
	}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEnginesAJERamjet
		configuration = TRA-400-mode2
		engineID = BackupEngine
		isMaster = False

		CONFIG
		{
			name = TRA-400 Ramjet
			description = Ramjet bypass mode of the TRA-400. Design speed M6.8@31km.
			specLevel = prototype
			massMult = 1.0	// Mass of Ramjet *and* Turbojet
			heatProduction = 10

			Area = 1.767	//Required Area (see above notes for actual number. AJE wants more.)
			Mdes = 3.5		//Mach Design Point (Up to mach 6.8)
			Tdes = 280		//Temp Design Point
			eta_n = 0.98		//Efficiency at afterburner rear / nozzle entrance
			FHV = 64800000	//Fuel heat of burning (joules?)
			maxFar = 0.07	//assumed same as STRJ11A
			maxEngineTemp = 6000 //Mach 6.8
			thrustUpperLimit = 367

			// Engine fitting params
			maxThrust = 367	//Just to let MEC know thrust
			throttleResponseMultiplier = 1.0

			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 1.0
				DrawGauge = True
			}
		}
	}
}

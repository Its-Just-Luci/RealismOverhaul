//	==================================================
//	Engine: STRJ11A-27
//
//	Manufacturer: McDonnell Aircraft Company
//
//	=================================================================================
//	J-58 P-4
//	1966, McDonnell Mach 6 HYFAC
//
//	Dry Mass: 2835 kg
//	Thrust (Dry): 111.2 kN
//	Thrust (Wet): 151.2 kN
//	SFC (Dry): 0.8 lb/lbf-hr
//	Area: 0.58 m^2	//Compressor Area
//	BPR: 0.0		//Bypass Ratio
//	CPR: 8.5		//Compressor Pressure Ratio
//	FPR: 0.0		//Fan Ratio
//	Mdes: 0.3 M		//Mach Design Point
//	Tdes: 280 K		//Temp Design Point
//	eta_n: 0.9		//Efficiency at afterburner rear / nozzle entrance
//	FHV: 32000000 J	//Fuel heat of burning
//	TIT: 1363 K		//Combustion peak temp
//	TAB: 1940* K		//Afterburner peak temp
//	maxT3: 1000 K	//Turbine max temperature
//	Exhaust Mixer: false
//	Adjustable Nozzle: true
//	=================================================================================
//	STRJ11A-27
//	1970, McDonnell Mach 6 HYFAC
//	Envelope M1.0@55kft to M6.0@120kft
//
//	Dry Mass: N/A kg
//	Thrust: 400 kN	//chart looks like somewhere between 400 and 425kN
//	Area: 2.108 m^2		//Compressor Area
//	Mdes: 6.0 M			//Mach Design Point
//	Tdes: 280 K			//Temp Design Point
//	eta_n: 0.9			//Efficiency at afterburner rear / nozzle entrance
//	FHV: 98000000 J		//Fuel heat of burning		sfc 3.2 M3.0 @ 45kft
//	maxFar: 0.126		//Max fuel to air ratio
//	maxEngineTemp: 4600 K	//Engine max temperature
//	=================================================================================

//	Sources:

//	https://ntrs.nasa.gov/api/citations/19710072319/downloads/19710072319.pdf
//	https://www.eoas.ubc.ca/courses/atsc113/flying/met_concepts/02-met_concepts/02a-std_atmos-P/index.html
//	https://aerospaceweb.org/question/atmosphere/q0112.shtml

//	Used by:

//	Notes:
//	==================================================
@PART[*]:HAS[#engineType[STRJ11A]]:FOR[RealismOverhaulEngines]
{

	%title = #roSTRJ11ATitle	//STRJ11A Turbo-Ramjet
	%manufacturer = #roMfrPW
	%description = #roSTRJ11ADesc

	@tags ^= :$: usa curtiss-wright curtiss wright j67 j-67 STRJ11A rj-55 ramjet turbojet

	%specLevel = prototype	//operational, prototype, concept, speculative, altHist, sciFi

	!MODULE[ModuleEngines*],*{}

	MODULE
	{
		name = ModuleEnginesAJEJet
		EngineType = Turbine
		thrustVectorTransformName = thrustTransform
		engineID = MainEngine
	}
	MODULE
	{
		name = ModuleEnginesAJERamjet
		EngineType = Turbine
		thrustVectorTransformName = thrustTransform
		engineID = BackupEngine
	}
	
	@MODULE[ModuleAlternator]
	{
		@RESOURCE[ElectricCharge]
		{
			%rate = 50.0
		}
	}
	!MODULE[ModuleGimbal]{}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEnginesAJEJet
		configuration = J67-W-3
		engineID = MainEngine
		isMaster = True
		origMass = 5.263

		CONFIG
		{
			name = J58-P-4
			description = JT11D-20, as used on the SR-71A/B and YF-12A. Temperature Mach limit at 15 km: 3.6.
			specLevel = operational
			massMult = 1.00
			
			Area = 0.58		//Compressor Area
			BPR = 0.0		//Bypass Ratio
			CPR = 8.5		//Compressor Pressure Ratio
			FPR = 0.0		//Fan Ratio
			Mdes = 0.3		//Mach Design Point
			Tdes = 280		//Temp Design Point
			eta_c = 0.95	//Efficiency at burner inlet
			eta_t = 0.98	//Efficiency at burner exit
			eta_n = 0.9		//Efficiency at afterburner rear / nozzle entrance
			FHV = 32000000	//Fuel heat of burning (joules?)
			TIT = 1363		//Combustion peak temp
			TAB = 1940		//Afterburner temp?
			maxT3 = 1000		//Turbine max temperature
			exhaustMixer = False
			adjustableNozzle = True
			thrustUpperLimit = 300
			
			// Engine fitting params
			defaultTPR = 0.85
			dryThrust = 111.2
			wetThrust = 151.2
			maxThrust = 151.2	//Just to let MEC know thrust
			drySFC = 0.8
			throttleResponseMultiplier = 0.20

			PROPELLANT
			{
				name = Kerosene
				ratio = 1.0
				DrawGauge = True
			}
			
			OtherModules
			{
				BackupEngine = STRJ11A-27
			}
		}
	}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEnginesAJERamjet
		configuration = STRJ11A-27
		engineID = BackupEngine
		isMaster = False

		CONFIG
		{
			name = STRJ11A-27
			//description = 
			specLevel = prototype
			massMult = 1.00
			heatProduction = 10
			
			Area = 2.108	//Compressor Area NOTE: Total inlet area for the engine is 2.688m^2, and could sustain both the ramjet and turboramjet at full thrust at transition/handoff at Mach 3.75
			Mdes = 6.00		//Mach Design Point
			Tdes = 280		//Temp Design Point
			eta_n = 0.9		//Efficiency at afterburner rear / nozzle entrance (presumed the same as the J58 in worst-case scenario)
			FHV = 98000000	//Fuel heat of burning (joules?)
			maxFar = 0.126	// Estimated using mach at altitude, air density, and fuel consumption figures.
			maxEngineTemp = 5600	// this is a guess and needs in-game tuning. its also based more in KSP than physics, so will likely be very unrealistic on paper
			thrustUpperLimit = 400
			
			// Engine fitting params
			maxThrust = 400	//Just to let MEC know thrust
			throttleResponseMultiplier = 1.0

			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 1.0
				DrawGauge = True
			}
		}
	}
}

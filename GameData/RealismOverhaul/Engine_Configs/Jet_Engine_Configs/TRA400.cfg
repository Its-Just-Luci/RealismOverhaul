//	==================================================
//	Engine: TRA-400
//
//	Manufacturer: McDonnell Aircraft Company
//
//	=================================================================================
//	TRA-400
//	1992, Sanger II
//
//
//	Dry Mass: 3000 kg
//	Thrust (Dry): ??? kN
//	Thrust (Wet): 400 kN
//	SFC (Dry): 0.9 lb/lbf-hr
//	Area: 1.25 m^2	//Compressor Area
//	BPR: 0.0		//Bypass Ratio
//	CPR: 6.0		//Compressor Pressure Ratio
//	FPR: 0.0		//Fan Ratio
//	Mdes: 1.2 M		//Mach Design Point (Up to M3.5)
//	Tdes: 280 K		//Temp Design Point
//	eta_n: 0.98		//Efficiency at afterburner rear / nozzle entrance
//	FHV: 64000000 J	//Fuel heat of burning
//	TIT: 2000 K		//Combustion peak temp
//	TAB: 2800 K		//Afterburner peak temp
//	maxT3: 1100 K	//Turbine max temperature
//	Exhaust Mixer: false
//	Adjustable Nozzle: true
//	=================================================================================
//	TRA-400-RJ
//	1970, McDonnell Mach 6 HYFAC
//	Envelope M1.0@55kft to M6.0@120kft
//
//
//    Dry Mass: 3000 kg
//    Thrust: 400 kN	// (this might be a misreading?)
//    Area: 1.25 m^2	//Area 
//    Mdes: 6.8 M	//Mach Design Point
//    Tdes: 250 K            //Temp Design Point
//    eta_n: 0.98 (assumed)    //Efficiency at nozzle entrance
//    FHV: 64000000 J        //Fuel heat of burning
//    maxFar: 0.07           //Max fuel to air ratio
//    maxEngineTemp: 7000 K    //Engine max temperature
//	=================================================================================

//	Sources:

//	[1] https://ntrs.nasa.gov/api/citations/19710072319/downloads/19710072319.pdf
//	https://www.eoas.ubc.ca/courses/atsc113/flying/met_concepts/02-met_concepts/02a-std_atmos-P/index.html
//	https://aerospaceweb.org/question/atmosphere/q0112.shtml

//	Used by:

//	Notes:
//	==================================================
@PART[*]:HAS[#engineType[STRJ11A]]:FOR[RealismOverhaulEngines]
{

	%title = #roSTRJ11ATitle	//STRJ11A-27 Turbo-Ramjet
	%manufacturer = #roMfrPW
	%description = #roSTRJ11ADesc

	@tags ^= :$: usa pratt whitney turboramjet STRJ11A ramjet turbojet

	%specLevel = prototype	//operational, prototype, concept, speculative, altHist, sciFi

	!MODULE[ModuleEngines*],*{}

	MODULE
	{
		name = ModuleEnginesAJEJet
		EngineType = Turbine
		thrustVectorTransformName = thrustTransform
		engineID = MainEngine
	}
	MODULE
	{
		name = ModuleEnginesAJERamjet
		EngineType = Turbine
		thrustVectorTransformName = thrustTransform
		engineID = BackupEngine
	}

	@MODULE[ModuleAlternator]
	{
		@RESOURCE[ElectricCharge]
		{
			%rate = 50.0
		}
	}
	!MODULE[ModuleGimbal]{}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEnginesAJEJet
		configuration = TRA-400
		engineID = MainEngine
		isMaster = True
		origMass = 3.09

		CONFIG
		{
			name = TRA-400
			description = TRA-400 turbojet as intended for Sanger II. Temperature limit at 15km Mach 3.
			specLevel = operational
			massMult = 1.00

			Area = 1.25		//Compressor Area
			BPR = 0.0		//Bypass Ratio
			CPR = 6.0		//Compressor Pressure Ratio
			FPR = 0.0		//Fan Ratio
			Mdes = 1.2		//Mach Design Point
			Tdes = 280		//Temp Design Point
			eta_c = 0.98	//Efficiency at burner inlet
			eta_t = 0.98	//Efficiency at burner exit
			eta_n = 0.98		//Efficiency at afterburner rear / nozzle entrance
			FHV = 64000000	//Fuel heat of burning (joules?)
			TIT = 2000		//Combustion peak temp
			TAB = 2800		//Afterburner temp?
			maxT3 = 1100		//Turbine max temperature (FIXME)
			exhaustMixer = False
			adjustableNozzle = True
			thrustUpperLimit = 400

			// Engine fitting params
			defaultTPR = 0.85
			dryThrust = 200.0 //This is a guess
			wetThrust = 400.0
			maxThrust = 450	//Just to let MEC know thrust
			drySFC = 0.9
			throttleResponseMultiplier = 0.20

			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 1.0
				DrawGauge = True
			}

			OtherModules
			{
				BackupEngine = TRA-400RJ
			}
		}
	}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEnginesAJERamjet
		configuration = TRA-400RJ
		engineID = BackupEngine
		isMaster = False

		CONFIG
		{
			name = TRA-400RJ
			description = TRA-400 Ramjet as intended for Sanger II. Flight mach limit at 31km Mach 6.8
			specLevel = operational
			massMult = 1.0	// Mass of Ramjet *and* Turbojet
			heatProduction = 10

			Area = 1.25		//Compressor Area (2.38 m2 is also quoted, which minus the j58 gives 1.8)
			Mdes = 6.8		//Mach Design Point
			Tdes = 250		//Temp Design Point
			eta_n = 0.98		//Efficiency at afterburner rear / nozzle entrance
			FHV = 64800000	//Fuel heat of burning (joules?) (72900000 might be a bit better?)
			maxFar = 0.07	//I am assuming the same FAR as the STRJ11A as this is the best comparison I have...
			maxEngineTemp = 7000  //little higher than the STRJ11A
			thrustUpperLimit = 500  //Some sources say 400, some 500?

			// Engine fitting params
			maxThrust = 500	//Just to let MEC know thrust
			throttleResponseMultiplier = 1.0

			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 1.0
				DrawGauge = True
			}
		}
	}
}

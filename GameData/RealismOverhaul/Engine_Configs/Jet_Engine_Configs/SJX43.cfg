//	==================================================
//	Engine: SJX43
//
//	Manufacturer: General Applied Science Laboratory
//
//	=================================================================================
//	SJX43-A
//	2004, X-43
//	Envelope M6.83@95kft to M9.81@109kft?
//
//	Dry Mass: 610 kg	//TWR of ~2 assumed
//	Thrust: 11.92 kN
//	Area: 0.108 m^2		//Compressor Area
//	Mdes: 9.8 M			//Mach Design Point
//	Tdes: 225 K			//Temp Design Point
//	eta_n: 0.98			//Efficiency at afterburner rear / nozzle entrance
//	FHV: 64800000 J		//Fuel heat of burning
//	maxFar: 0.081		//Max fuel to air ratio
//	maxEngineTemp: 4000 K	//Engine max temperature
//	=================================================================================
//	SJX43-D
//	2007, X-43D
//	Envelope M12 to M15
//
//	Dry Mass: 610 kg	//weight allegedly remained constant
//	Thrust: 11.92 kN	//thrust did too.
//	Area: 0.108 m^2		//Compressor Area
//	Mdes: 9.8 M			//Mach Design Point
//	Tdes: 225 K			//Temp Design Point
//	eta_n: 0.98			//Efficiency at afterburner rear / nozzle entrance
//	FHV: 64800000 J		//Fuel heat of burning
//	maxFar: 0.081		//Max fuel to air ratio
//	maxEngineTemp: 4000 K	//Engine max temperature
//	=================================================================================

//	Sources:

//	https://ntrs.nasa.gov/api/citations/20050212037/downloads/20050212037.pdf

//	==================================================
@PART[*]:HAS[#engineType[SJX43]]:FOR[RealismOverhaulEngines]
{

	%title = SJX43 Ramjet
	%manufacturer = General Applied Science Laboratory
	%description = #roSJX43Desc

	@tags ^= :$: usa scramjet X43 X-43 43

	%specLevel = prototype	//operational, prototype, concept, speculative, altHist, sciFi

	@MODULE[ModuleEngines*]
	{
		@name = ModuleEnginesAJERamjet
		%EngineType = Turbine
		@PROPELLANT[LiquidFuel]
		{
			@name = LqdHydrogen
		}
	}

	!MODULE[ModuleAlternator]{}
	!MODULE[ModuleGimbal]{}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEnginesAJERamjet
		configuration = SJX43-A
		modded = false
		origMass = 0.6

		CONFIG
		{
			name = SJX43-A
			description = SJX43-A, tested on the X-43. Design speed M9.8@33.4 km.
			specLevel = prototype
			massMult = 1.00
			heatProduction = 10
			
			Area = 0.108		//Compressor Area
			Mdes = 9.8		//Mach Design Point
			Tdes = 225		//Temp Design Point
			eta_n = 0.98		//Efficiency at afterburner rear / nozzle entrance
			FHV = 64800000	//Fuel heat of burning (joules?)
			maxFar = 0.081
			maxEngineTemp = 6000	//dial this in later
			thrustUpperLimit = 11.92
			
			// Engine fitting params
			maxThrust = 11.92	//Just to let MEC know thrust
			throttleResponseMultiplier = 1.0

			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 1.0
				DrawGauge = True
			}
		}
		CONFIG
		{
			name = SJX43-D
			description = SJX43-D, planned for the X-43D. Design speed M15.0@36.6 km.
			specLevel = concept
			massMult = 1.00
			heatProduction = 10

			Area = 0.108		//Compressor Area
			Mdes = 15.0		//Mach Design Point
			Tdes = 225		//Temp Design Point
			eta_n = 0.98		//Efficiency at afterburner rear / nozzle entrance
			FHV = 64800000	//Fuel heat of burning (joules?)
			maxFar = 0.081
			maxEngineTemp = 6000	//dial this in later
			thrustUpperLimit = 11.92

			// Engine fitting params
			maxThrust = 11.92	//Just to let MEC know thrust
			throttleResponseMultiplier = 1.0

			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 1.0
				DrawGauge = True
			}
		}
	}
}
